backend:
  name: git-gateway
  branch: main

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

publish_mode: simple

collections:
  - name: site
    label: 站点设置 / 首页海报
    files:
      - name: settings
        label: 站点设置
        file: content/site.json
        fields:
          - { label: 品牌名, name: brand, widget: string }
          - { label: Logo 图片, name: logo, widget: image, required: false }
          - label: 首页 Hero
            name: hero
            widget: object
            fields:
              - { label: 眉标小字, name: eyebrow, widget: string }
              - { label: 主标题, name: title, widget: string }
              - { label: 高亮副标题, name: accent, widget: string }
              - { label: 导语, name: lead, widget: text }
              - { label: Hero 海报（上传图片）, name: poster, widget: image, required: false }
              - label: 数据徽章
                name: badges
                widget: list
                fields:
                  - { label: 数字, name: num, widget: string }
                  - { label: 说明, name: label, widget: string }
          - label: 实力数据
            name: stats
            widget: list
            fields:
              - { label: 数字, name: num, widget: string }
              - { label: 说明, name: label, widget: string }
          - label: 关于我们
            name: about
            widget: object
            fields:
              - { label: 图片, name: image, widget: image, required: false }
              - { label: 眉标, name: eyebrow, widget: string }
              - { label: 标题, name: title, widget: string }
          - label: 联系方式
            name: contact
            widget: object
            fields:
              - { label: 地址, name: address, widget: string }
              - { label: 邮箱, name: email, widget: string }
              - { label: WhatsApp / 微信, name: whatsapp, widget: string }
              - { label: 业务类型, name: business, widget: string }

  - name: products
    label: 产品
    files:
      - name: products
        label: 产品列表
        file: content/products.json
        fields:
          - label: 产品
            name: items
            widget: list
            fields:
              - { label: 产品名称, name: title, widget: string }
              - { label: 产品描述, name: desc, widget: text }
              - { label: 产品图, name: image, widget: image, required: false }
              - { label: 链接, name: href, widget: string, default: product-detail.html }

  - name: news
    label: 新闻
    files:
      - name: news
        label: 新闻列表
        file: content/news.json
        fields:
          - label: 新闻
            name: items
            widget: list
            fields:
              - { label: 标题, name: title, widget: string }
              - { label: 日期, name: date, widget: string }
              - { label: 摘要, name: excerpt, widget: text }
              - { label: 配图, name: image, widget: image, required: false }
              - { label: 链接, name: href, widget: string, default: news-detail.html }
